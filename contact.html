<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="siteHeader"></div>
<section class="page-banner"><h1>Contact Us</h1><p>We would love to hear from you.</p></section>
<section class="section"><div class="contact-grid">
<div><h2>Contact Details</h2>
<p>📍 <strong>Address:</strong> <span id="contactAddress"></span></p>
<p>📞 <strong>Phone:</strong> <a id="contactPhone" href="#"></a></p>
<p>✉️ <strong>Email:</strong> <a id="contactEmailLink" href="#"></a></p>
</div>
<div class="form-card"><h2>Find Us</h2><div id="contactMap" style="min-height:280px;border-radius:12px;overflow:hidden;margin-bottom:18px;background:#f5f5f5"></div><form id="contactForm">
<label>Name</label><input id="contactName" required>
<label>Email</label><input type="email" id="contactEmail" required>
<label>Message</label><textarea id="message" rows="6" required></textarea>
<button class="btn" type="submit">Send Message</button></form></div>
</div></section>
<div id="siteFooter"></div><script src="js/storage.js"></script><script src="js/main.js"></script><script src="js/contact.js"></script></body></html>
