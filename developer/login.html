<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Developer Login</title><link rel="stylesheet" href="../css/login.css"><link rel="stylesheet" href="../css/admin.css"><style>body{background:radial-gradient(circle at top,#f3e8ff,#faf7ff 45%,#eef2ff);}.login-card{border:1px solid #e9d5ff;box-shadow:0 22px 70px #4c1d951f}.login-icon{background:linear-gradient(135deg,#6d28d9,#8b5cf6)!important;box-shadow:0 12px 28px #6d28d944}.login-btn{background:linear-gradient(135deg,#6d28d9,#8b5cf6)!important}.dev-links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:14px}</style></head><body><div class="login-page"><div class="login-card"><div class="login-icon">🧑‍💻</div><h1>Developer Login</h1><p>Full website management access</p><form id="developerLogin"><label>Username</label><input id="username" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button class="login-btn" type="submit">🛠️ Login as Developer</button><p id="error" style="color:#b91c1c;text-align:center"></p></form><div class="dev-links"><a href="recover.html">🔑 Forgot Password?</a></div><p style="text-align:center"><a href="../index.html">← Back to Website</a></p></div></div><script>document.getElementById("developerLogin").onsubmit=e=>{e.preventDefault();const auth=JSON.parse(localStorage.getItem("tms_auth_settings")||"null")||{developer:{username:"developer",password:"developer123"}};if(username.value.trim()===auth.developer.username&&password.value===auth.developer.password){sessionStorage.setItem("tms_developer","yes");location.href="panel.html"}else error.textContent="Invalid developer username or password."};</script></body></html>
