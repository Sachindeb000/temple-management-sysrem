<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Developer Account Security</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"><style>.security-wrap{max-width:900px;margin:28px auto;padding:0 18px}.security-card{background:#fff;border-radius:20px;padding:26px;box-shadow:0 12px 40px #0001}.security-card label{display:block;font-weight:700;margin:12px 0 6px}.security-card input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;text-decoration:none}.primary{background:#6d28d9;color:#fff}.secondary{background:#f1eaff;color:#5b21b6}.msg{margin-top:12px;font-weight:700}</style></head><body><div id="adminShell"></div><main class="admin-main"><div class="security-wrap"><div class="admin-title"><h1>🧑‍💻 Developer Account Security</h1><p>Change your Developer username, password and recovery phone.</p></div><div class="security-card"><label>Current Username</label><input id="currentUsername"><label>New Username</label><input id="newUsername"><label>Current Password</label><input id="currentPassword" type="password"><label>New Password</label><input id="newPassword" type="password" minlength="6"><label>Confirm New Password</label><input id="confirmPassword" type="password" minlength="6"><label>Recovery Phone</label><input id="phone" type="tel"><div class="actions"><button class="btn primary" id="save">💾 Save Account Changes</button><a class="btn secondary" href="recover.html">📱 Forgot Password / Recover</a><a class="btn secondary" href="panel.html">← Developer Panel</a></div><div class="msg" id="msg"></div></div></div></main><script src="../js/storage.js"></script><script src="../admin/js/admin.js"></script><script>if(sessionStorage.getItem("tms_developer")!=="yes")location.href="login.html";const auth=getData("authSettings")||{},a=auth.developer||{};currentUsername.value=a.username||"";phone.value=a.phone||"";function say(t,ok=false){msg.textContent=t;msg.style.color=ok?"#15803d":"#b91c1c"}save.onclick=()=>{if(currentUsername.value.trim()!==a.username)return say("Current username is incorrect.");if(currentPassword.value!==a.password)return say("Current password is incorrect.");const nu=newUsername.value.trim(),np=newPassword.value,cf=confirmPassword.value,ph=phone.value.replace(/\D/g,"");if(nu.length<4)return say("New username must be at least 4 characters.");if(np&&np.length<6)return say("New password must be at least 6 characters.");if(np!==cf)return say("New passwords do not match.");if(!/^\d{10,15}$/.test(ph))return say("Enter a valid recovery phone number.");auth.developer={username:nu,password:np||a.password,phone:ph};saveData("authSettings",auth);say("Developer account updated successfully.",true);currentUsername.value=nu;currentPassword.value="";newPassword.value="";confirmPassword.value=""};</script></body></html>
