<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Temple Management System</title>
<link rel="stylesheet" href="../css/login.css">
</head>

<body class="login-page">

<div class="login-container">
    <div class="login-box">

        <div class="temple-logo">🛕</div>

        <h1>Admin Login</h1>
        <p class="login-subtitle">Temple Management System</p>

        <form id="loginForm" autocomplete="off">

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Enter username"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <span class="input-icon">🔒</span>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter password"
                        required
                    >
                </div>
            </div>

            <button class="login-button" type="submit">
                Login to Admin Panel
            </button>

            <div id="loginError" class="login-error">
                Invalid username or password.
            </div>
        </form>

        <div class="demo-login">
            Default Login: <strong>admin</strong> / <strong>admin123</strong>
        </div>

        <a class="back-link" href="recover.html">📱 Forgot Password / Recover</a><br>
        <a class="back-link" href="../index.html">
            ← Back to Website
        </a>

        <div class="login-footer">
            © 2026 Temple Management System
        </div>

    </div>
</div>

<script>
(function () {
    const form = document.getElementById("loginForm");
    const error = document.getElementById("loginError");

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        const auth = JSON.parse(localStorage.getItem("tms_auth_settings") || "null") || {admin:{username:"admin",password:"admin123"}};
        if (username === auth.admin.username && password === auth.admin.password) {
            sessionStorage.setItem("tms_admin", "yes");
            window.location.replace("dashboard.html");
        } else {
            error.style.display = "block";
            document.getElementById("password").value = "";
            document.getElementById("password").focus();
        }
    });
})();
</script>

</body>
</html>
