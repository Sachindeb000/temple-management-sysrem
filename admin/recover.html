<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Account Recovery</title><link rel="stylesheet" href="../css/login.css"><style>.recovery{max-width:520px;margin:60px auto;padding:20px}.card{background:#fff;padding:28px;border-radius:20px;box-shadow:0 15px 45px #0002}.card label{display:block;font-weight:700;margin:12px 0 6px}.card input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px}.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#8b5e34;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:12px;font-weight:700}</style></head><body><div class="recovery"><div class="card"><h1>🔐 Admin Recovery</h1><p>Enter the phone number registered to the Admin account.</p><label>Registered Phone</label><input id="phone" type="tel"><label>New Password</label><input id="newPassword" type="password" minlength="6"><label>Confirm Password</label><input id="confirmPassword" type="password" minlength="6"><button class="btn" id="reset">Set New Password</button><div class="msg" id="msg"></div><p><a href="login.html">← Back to Admin Login</a></p></div></div><script src="../js/storage.js"></script><script>function say(t,ok=false){msg.textContent=t;msg.style.color=ok?"#15803d":"#b91c1c"}reset.onclick=()=>{const ph=phone.value.replace(/\D/g,"");let auth=getData("authSettings")||{},a=auth.admin||{};if(ph!==String(a.phone||"").replace(/\D/g,""))return say("Phone number does not match the Admin account.");if(newPassword.value.length<6)return say("Password must be at least 6 characters.");if(newPassword.value!==confirmPassword.value)return say("Passwords do not match.");a.password=newPassword.value;auth.admin=a;saveData("authSettings",auth);say("Password updated successfully. You can login now.",true);newPassword.value="";confirmPassword.value=""}</script></body></html>
