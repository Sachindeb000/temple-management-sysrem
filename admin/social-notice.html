<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Social Media & Notice</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body><div id="adminShell"></div><main class="admin-main">
<div class="admin-topbar"><div><h1>📱 Social Media & Notice Board</h1><p>Manage social links and multiple notices shown on the Home page.</p></div></div>
<div class="admin-card"><h2>📱 Social Media Links</h2><form id="socialForm"><div class="form-grid"><div class="form-group"><label>Facebook URL</label><input id="facebook" type="url" placeholder="https://facebook.com/yourpage"></div><div class="form-group"><label>YouTube URL</label><input id="youtube" type="url" placeholder="https://youtube.com/@yourchannel"></div><div class="form-group"><label>Instagram URL</label><input id="instagram" type="url" placeholder="https://instagram.com/yourprofile"></div></div><button type="submit">💾 Save Social Links</button></form><div id="socialMsg"></div></div>
<div class="admin-card"><div class="section-head"><div><h2>📢 Notice Board</h2><p class="muted">Add as many notices as you need. Active notices appear highlighted on Home.</p></div><button id="newNoticeBtn" type="button">➕ Add Notice</button></div><div id="noticeEditor"></div><div id="noticeList"></div></div>
</main><script src="../js/storage.js"></script><script src="js/admin.js"></script><script src="js/social-notice.js"></script></body></html>
