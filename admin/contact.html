<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Contact Settings</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head><body><div id="adminShell"></div><main class="admin-main"><div class="admin-topbar"><div><h1>Contact Settings</h1><p>Manage the public Contact page details and location.</p></div></div><div class="card"><div id="saveMsg"></div><form id="contactSettingsForm"><div class="form-grid"><div class="form-group"><label>Address</label><textarea id="address" required></textarea><small style="display:block;color:#6b7280;margin-top:6px">The map location will be shown automatically from this address.</small></div><div class="form-group"><label>Phone Number</label><input id="phone" type="tel" required></div><div class="form-group"><label>Email Address</label><input id="email" type="email" required></div></div><button type="submit">Save Contact Details</button></form></div><div class="card"><h2>📍 Location Preview</h2><p style="margin-top:0;color:#6b7280">This map uses the address entered above.</p><div id="previewMap" style="min-height:380px;border-radius:12px;overflow:hidden"></div></div><div class="card"><h2>Preview</h2><p><strong>Address:</strong> <span id="previewAddress"></span></p><p><strong>Phone:</strong> <a id="previewPhone" href="#"></a></p><p><strong>Email:</strong> <a id="previewEmail" href="#"></a></p></div></main><script src="../js/storage.js"></script><script src="js/admin.js"></script><script src="js/contact-settings.js"></script></body></html>
