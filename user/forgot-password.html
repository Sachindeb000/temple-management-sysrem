<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Forgot Password | User Portal</title><link rel="stylesheet" href="../css/user.css"><style>.forgot-wrap{max-width:520px;margin:50px auto;padding:20px}.forgot-card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 14px 40px #0002}.forgot-card label{display:block;font-weight:700;margin:12px 0 6px}.forgot-card input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px}.forgot-btn{margin-top:15px;width:100%;border:0;border-radius:11px;padding:14px;font-weight:800;cursor:pointer;background:#8b5e34;color:#fff}.msg{margin-top:12px;font-weight:700}</style></head><body class="user-auth-page"><div class="forgot-wrap"><div class="forgot-card"><div class="auth-head"><div class="auth-icon">🔑</div><h1>Forgot Password</h1><p>Enter the phone number registered with your account.</p></div><label>Registered Phone</label><input id="phone" type="tel" placeholder="10 digit phone number"><label>New Password</label><input id="newPassword" type="password" minlength="6" placeholder="At least 6 characters"><label>Confirm Password</label><input id="confirmPassword" type="password" minlength="6"><button class="forgot-btn" id="resetPassword">Set New Password</button><div class="msg" id="msg"></div><p style="text-align:center;margin-top:18px"><a href="login.html">← Back to Login</a></p></div></div><script src="../js/storage.js"></script><script>resetPassword.onclick=()=>{const ph=phone.value.replace(/\D/g,"");let users=getData("users"),u=users.find(x=>(x.phone||"").replace(/\D/g,"")===ph);if(!u)return say("Phone number does not match any account.");if(newPassword.value.length<6)return say("Password must be at least 6 characters.");if(newPassword.value!==confirmPassword.value)return say("Passwords do not match.");u.password=newPassword.value;saveData("users",users);say("Password updated successfully. You can login now.",true);newPassword.value="";confirmPassword.value=""};function say(t,ok=false){msg.textContent=t;msg.style.color=ok?"#15803d":"#b91c1c"}</script></body></html>
