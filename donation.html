<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donation</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="siteHeader"></div>
<section class="page-banner"><h1>Donation</h1><p>Support temple activities.</p></section>
<section class="section"><div class="form-card"><h2>Donation Form</h2>
<form id="donationForm">
<label>Name</label><input id="donorName" required>
<label>Phone</label><input id="donorPhone" required>
<label>Amount</label><input type="number" id="amount" min="1" required>
<label>Purpose</label><select id="purpose"><option>Temple Development</option><option>Annadan</option><option>Puja</option><option>General Donation</option></select>
<button class="btn" type="submit">Submit Donation</button>
</form></div></section>
<div id="siteFooter"></div><script src="js/storage.js"></script><script src="js/main.js"></script><script src="js/donation.js"></script></body></html>
